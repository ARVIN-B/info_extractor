[program:celery]
process_name=%(program_name)s_%(process_num)02d
directory=/app
command=/usr/local/bin/python -m celery -A app worker --loglevel=INFO --concurrency=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/app-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:celery-beat]
process_name=%(program_name)s_%(process_num)02d
directory=/app
command=/usr/local/bin/python -m celery -A app beat --loglevel=INFO
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/app-beat.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
